server {
    listen 80;
    listen [::]:80;

    server_name hiplingo.com www.hiplingo.com;

    root /var/www/hiplingo.com/current;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Public release/catalog output consumed by the React application.
    # metadata-editor remains private; only sanitized publication output belongs here.
    location /media/ {
        alias /var/www/hiplingo.com/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";

        types {
            application/json                 json;
            application/vnd.apple.mpegurl    m3u8;
            video/iso.segment                m4s;
            video/mp2t                       ts;
            audio/mpeg                       mp3;
            audio/mp4                        m4a;
            audio/ogg                        ogg opus;
            image/jpeg                       jpg jpeg;
            image/png                        png;
            image/webp                       webp;
            image/avif                       avif;
        }
    }

    # Vite fingerprinted assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the SPA entry document aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React/Vite client-side routes: /listen, /releases/:id, /artists, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reserved for the future Jam Agreement participant API.
    # Do not enable until its backend, authentication/rate limits, and storage are ready.
    # location /api/jam/ {
    #     proxy_pass http://127.0.0.1:4175/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
