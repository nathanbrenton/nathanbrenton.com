# nathanbrenton.com on web-prod-01
# Installed as /etc/nginx/sites-available/nathanbrenton.com (symlinked into sites-enabled).
# Needs deploy/nginx/nathanbrenton-com-http.conf in /etc/nginx/conf.d/ (rate limit + cache map).
# Certificate lines match what certbot wrote on the host; keep them if certbot re-runs.
#
# Header rule: every add_header lives at server level. A location with its own add_header
# would silently drop all of these, so locations use `expires` (via the map) instead.

# Canonical host: https://nathanbrenton.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nathanbrenton.com;

    ssl_certificate /etc/letsencrypt/live/nathanbrenton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nathanbrenton.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://nathanbrenton.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name nathanbrenton.com;

    ssl_certificate /etc/letsencrypt/live/nathanbrenton.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nathanbrenton.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nathanbrenton.com/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    expires $nathanbrenton_expires;
    error_page 404 /404.html;

    # Public hidden-path protection (.git, .env, ...). ACME uses HTTP on port 80, not this block.
    location ~ /\. {
        return 404;
    }

    location = /404.html {
        internal;
    }

    # Quote form -> nathanbrenton-form service (deploy/form/).
    location = /api/quote-request {
        limit_except POST { deny all; }
        limit_req zone=nathanbrenton_form burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:18770;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Plain HTTP: everything moves to HTTPS (certbot's renewals use this block too).
server {
    listen 80;
    listen [::]:80;
    server_name nathanbrenton.com www.nathanbrenton.com;
    return 301 https://nathanbrenton.com$request_uri;
}
