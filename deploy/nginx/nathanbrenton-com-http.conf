# nathanbrenton.com: http-level settings used by sites-available/nathanbrenton.com.
# Installed as /etc/nginx/conf.d/nathanbrenton-com-http.conf.

# Quote form: 6 posts a minute per address (plus a burst of 4), like the ASAP form.
limit_req_zone $binary_remote_addr zone=nathanbrenton_form:1m rate=6r/m;

# Browser caching by type. Pages are always rechecked; CSS and JS are not fingerprinted,
# so they are kept for a day; images and fonts for 30 days.
map $sent_http_content_type $nathanbrenton_expires {
    default                  off;
    ~^text/html              epoch;
    ~^text/css               1d;
    ~javascript              1d;
    ~^image/                 30d;
    ~^font/                  30d;
    application/pdf          1d;
}
